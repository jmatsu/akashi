# Build the bundle and publish it to Cloudflare Pages, the canonical host for
# <https://aka.jmatsu.dev/>. GitHub Pages still exists, but ci.yml now puts a
# redirect there rather than the app.
#
# Standalone rather than a job in ci.yml, because the two want different builds:
# Cloudflare serves from the root, so this one leaves `base` at the default `/`.
#
# A pull request from this repository gets a preview deployment on its own
# branch, and the URL is posted back as a single comment that later pushes edit
# in place. A fork's pull request has no access to the secrets, so it is skipped
# rather than failed.
#
# Actions are pinned to a commit, since a tag can be moved. The trailing comment
# is the release that commit was, so a bump says what it is moving away from.
#
# Setup on the Cloudflare side, once:
#   - A Pages project named `aka`, production branch `main`
#   - aka.jmatsu.dev as a custom domain on that project
#   - Repository secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN, the
#     token scoped to Cloudflare Pages:Edit
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded preview is worth cancelling; a production deploy in flight is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The tests import `.ts` files directly, which needs Node's type stripping.
  NODE_VERSION: '24'
  CLOUDFLARE_PAGES_PROJECT: aka

jobs:
  deploy:
    name: Build & deploy
    # Secrets are not exposed to a fork's pull request, so there is nothing to
    # deploy with; ci.yml still builds and tests the commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the preview comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crate
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: wasm-pack
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # wasm-pack, then `tsc --noEmit`, then the bundle.
      - run: npm run build
      # One of these reads `dist/` to hold the bundle to the no-network policy.
      # Nothing that fails it should reach the live site, and this workflow does
      # not wait on ci.yml, so it is checked here too.
      - run: npm run test:web

      # Any branch other than the project's production branch is a preview, so
      # the branch name is what separates the two.
      - id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # The per-deployment URL is stable forever; the alias is the per-branch
          # one, which is the nicer link but only exists on a preview.
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            // Keyed by this marker so a later push edits the comment it left
            // last time rather than adding another one.
            const marker = '<!-- cloudflare-pages-preview -->'
            const { DEPLOYMENT_URL, ALIAS_URL } = process.env
            const head = context.payload.pull_request.head
            const body = [
              marker,
              '### Cloudflare Pages preview',
              '',
              '| | |',
              '| --- | --- |',
              `| Preview | ${ALIAS_URL || DEPLOYMENT_URL} |`,
              `| This build | ${DEPLOYMENT_URL} |`,
              `| Commit | \`${head.sha.slice(0, 7)}\` on \`${head.ref}\` |`,
            ].join('\n')

            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            })
            const existing = comments.find((c) => c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
