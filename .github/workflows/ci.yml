# Build, lint, test and format, then publish the result to GitHub Pages.
#
# The jobs are split by toolchain rather than by check, so nothing is installed
# twice: `web` needs only Node, `crate` only Rust, and `build` -- the one job
# that needs both, because the TypeScript imports the generated wasm bindings --
# typechecks, runs the web tests and produces the bundle.
#
# Anything that does not compile Rust runs on `ubuntu-slim`; the crate needs a
# host linker for the proc-macro half of wasm-bindgen, so those jobs take the
# full image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded pull request run is worth cancelling; a deploy in flight is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The tests import `.ts` files directly, which needs Node's type stripping.
  NODE_VERSION: '24'

jobs:
  # Lint and format for everything Biome owns: TypeScript, CSS, JSON.
  web:
    name: Lint & format (web)
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # `biome ci` is `lint` and `format --check` in a single pass.
      - run: npx biome ci .

  # Format, lint and test for the Rust core.
  crate:
    name: Lint, format & test (crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - run: npm run format:check:core
      - run: npm run lint:core
      - run: npm run test:core

  # Typecheck, web tests and the production bundle. All three need the wasm
  # bindings, so they share the one job that can build them.
  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    env:
      # A project site is served under the repository name; `vite.config.ts`
      # takes that as `base`. A custom domain at the origin root would be `/`.
      AKA_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # wasm-pack, then `tsc --noEmit`, then the bundle.
      - run: npm run build
      # The web tests import the bindings the build just generated.
      - run: npm run test:web
      # Uploaded on pull requests too, so a broken bundle shows up before merge.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: [web, crate, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
