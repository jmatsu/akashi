<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aka is now Akashi</title>
    <!-- akashi.jmatsu.dev is the custom domain on the Cloudflare Pages project
         that deploy.yml deploys to; the two move together. -->
    <link rel="canonical" href="https://akashi.jmatsu.dev/" />
    <!-- The redirect without JavaScript. The script below does it faster, and
         carries the rest of the URL across; this only gets the origin right. -->
    <meta http-equiv="refresh" content="0; url=https://akashi.jmatsu.dev/" />
    <style>
      /* Matches INK in src/brand.ts and --text in src/style.css. */
      body {
        margin: 0;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        background: #1b1d21;
        color: #e7e9ee;
        font: 16px/1.6 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>aka is now Akashi, at <a href="https://akashi.jmatsu.dev/">akashi.jmatsu.dev</a>.</p>
    <script>
      // This site is served under the repository name, and the repository was
      // renamed -- so an address held from before arrives under the old one.
      // Everything past whichever prefix is what carries to the new origin.
      const { pathname, search, hash } = location
      const base = ['/akashi/', '/aka/'].find((b) => pathname.startsWith(b))
      const rest = base ? pathname.slice(base.length) : ''
      location.replace(`https://akashi.jmatsu.dev/${rest}${search}${hash}`)
    </script>
  </body>
</html>
