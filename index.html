<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>aka — 軽量アノテーションツール</title>
    <meta name="description" content="スクリーンショットに注釈・モザイク・黒塗りを入れる軽量ツール。インストール不要、オフラインでも動作します。" />
    <!-- Matches INK in src/brand.ts, which also feeds the manifest. -->
    <meta name="theme-color" content="#1b1d21" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="aka" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand"><span class="dot"></span>aka</div>

        <div class="actions">
          <button type="button" data-act="open">画像を開く</button>
          <button type="button" data-act="blank">白紙</button>
          <span class="sep"></span>
          <button type="button" data-act="undo" title="元に戻す (Ctrl/Cmd+Z)">元に戻す</button>
          <button type="button" data-act="redo" title="やり直す (Ctrl/Cmd+Shift+Z)">やり直す</button>
          <button type="button" data-act="clear">全消去</button>
          <span class="sep"></span>
          <button type="button" data-act="zoomout" title="縮小">−</button>
          <span id="zoom-label">100%</span>
          <button type="button" data-act="zoomin" title="拡大">＋</button>
          <button type="button" data-act="fit" title="全体表示 (Ctrl/Cmd+0)">全体</button>
          <span class="sep"></span>
          <button type="button" data-act="copy" title="クリップボードへコピー">コピー</button>
          <button type="button" data-act="save" class="primary" title="PNG で保存 (Ctrl/Cmd+S)">保存</button>
        </div>
      </header>

      <nav id="tools" aria-label="ツール"></nav>
      <div id="options" aria-label="オプション"></div>

      <div id="stage">
        <canvas id="canvas"></canvas>
        <p id="drop-hint">
          画像をドラッグ＆ドロップ、または <kbd>Ctrl/Cmd</kbd>+<kbd>V</kbd> で貼り付け
        </p>
      </div>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="loading">読み込み中…</div>

    <input id="file" type="file" accept="image/*" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
